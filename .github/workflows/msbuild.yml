name: Build ATKey

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  SOLUTION_FILE_PATH: .\Sources\OpenKey\win32\OpenKey
  BUILD_CONFIGURATION: Release

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build x86
      run: msbuild -m -target:Rebuild -p:Configuration=Release -p:Platform=x86 ${{env.SOLUTION_FILE_PATH}}

    - name: Build x64
      run: msbuild -m -target:Rebuild -p:Configuration=Release -p:Platform=x64 ${{env.SOLUTION_FILE_PATH}}

    # Gom binary vao mot thu muc phang. SignPath ky theo artifact nen artifact
    # phai chi chua thu can ky, khong lan tap tin trung gian cua trinh bien dich.
    - name: Collect binaries
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Path dist/x64, dist/x86 -Force | Out-Null
        Copy-Item "${{env.SOLUTION_FILE_PATH}}/x64/Release/ATKey64.exe"       dist/x64/
        Copy-Item "${{env.SOLUTION_FILE_PATH}}/x64/Release/OpenKeyUpdate.exe" dist/x64/
        Copy-Item "${{env.SOLUTION_FILE_PATH}}/Release/ATKey32.exe"           dist/x86/
        Copy-Item "${{env.SOLUTION_FILE_PATH}}/Release/OpenKeyUpdate.exe"     dist/x86/
        Get-ChildItem dist -Recurse -File |
          ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name }

    - name: Upload build artifact
      id: upload
      uses: actions/upload-artifact@v4
      with:
        name: ATKey
        path: dist/

    # ------------------------------------------------------------------
    # KY SO QUA SIGNPATH FOUNDATION (mien phi cho du an nguon mo)
    #
    # Bo comment khoi duoi sau khi don dang ky tai https://signpath.org/apply
    # duoc duyet. SignPath se cap organization-id va cac slug; luu API token
    # vao Settings > Secrets and variables > Actions voi ten SIGNPATH_API_TOKEN.
    #
    # SignPath ky truc tiep artifact cua GitHub Actions va doi chieu voi
    # provenance attestation ben duoi, nho vay chung minh duoc binary sinh ra
    # tu dung commit cua repo cong khai nay chu khong phai tu may ca nhan.
    # ------------------------------------------------------------------
    # - name: Sign with SignPath
    #   uses: signpath/github-action-submit-signing-request@v1
    #   with:
    #     api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
    #     organization-id: '<signpath cap>'
    #     project-slug: 'atkey'
    #     signing-policy-slug: 'release-signing'
    #     github-artifact-id: '${{ steps.upload.outputs.artifact-id }}'
    #     wait-for-completion: true
    #     output-artifact-directory: 'signed'

    outputs:
      subject-name: ATKey
      subject-digest: ${{steps.upload.outputs.artifact-digest}}

  attest:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read
      attestations: write

    steps:
    - name: Generate artifact attestation
      uses: actions/attest-build-provenance@v2
      with:
        subject-name: ${{needs.build.outputs.subject-name}}
        subject-digest: sha256:${{needs.build.outputs.subject-digest}}
